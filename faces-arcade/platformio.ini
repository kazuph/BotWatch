[platformio]
default_envs = m5core2

[env:m5core2]
platform = espressif32@6.13.0
board = m5stack-core2
board_build.partitions = huge_app.csv
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 460800
upload_speed = 460800
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.24
    m5stack/M5Unified@0.2.17
    symlink://../M5Faces
board_build.embed_files = kana_voice.bin
build_flags =
    -I .pio/libdeps/m5core2/M5Unified/src
