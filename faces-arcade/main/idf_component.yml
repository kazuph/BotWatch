dependencies:
  idf: ">=5.5,<5.6"
  espressif/esp-dl: "3.3.13"
  m5stack/m5unified: "0.2.27"
  m5stack/m5gfx: "0.2.34"
  m5faces:
    git: https://github.com/m5stack/M5Faces.git
    version: 639e63e559ee251005241a6dcfadba8110c97e93
  espressif/esp_new_jpeg:
    version: "1.0.2"
    rules:
      - if: "target == esp32s3"
  esp32_camera:
    git: https://github.com/espressif/esp32-camera.git
    version: 281d951f75b6559adec3cdb8cf076366da103880
    rules:
      - if: "target == esp32s3"
  imagenet_cls:
    git: https://github.com/espressif/esp-dl.git
    version: 6d3c4da1087d35916858dd0f9b3e9d6a85186e11
    path: models/imagenet_cls
    rules:
      - if: "target == esp32s3"
  human_face_detect:
    git: https://github.com/espressif/esp-dl.git
    version: 6d3c4da1087d35916858dd0f9b3e9d6a85186e11
    path: models/human_face_detect
    rules:
      - if: "target == esp32s3"
  espressif/led_strip:
    version: "3.0.3"
    rules:
      - if: "target == esp32s3"
